services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.3.10861-07dfddaeb-ls318
    container_name: plex
    network_mode: host
    environment:
      - PUID=1500
      - PGID=1500
      - TZ=America/New_York
      - VERSION=docker
    devices: [/dev/dri]
    volumes:
      - /docker/plex:/config
      - /mnt/TVShows:/mnt/TVShows
      - /mnt/Movies:/mnt/Movies
      - /mnt/Photos:/mnt/Photos
      - /mnt/Books:/mnt/Books
      - /mnt/Music:/mnt/Music

    restart: unless-stopped
