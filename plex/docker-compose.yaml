services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.5.11079-b3b13e506-ls330
    container_name: plex
    network_mode: host
    environment:
      - PUID=1500
      - PGID=1500
      - TZ=America/New_York
      - VERSION=docker
    devices: [/dev/dri]
    volumes:
      - /docker/plex:/config
      - /mnt/TVShows:/mnt/TVShows
      - /mnt/Movies:/mnt/Movies
      - /mnt/Photos:/mnt/Photos
      - /mnt/Books:/mnt/Books
      - /mnt/Music:/mnt/Music
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
